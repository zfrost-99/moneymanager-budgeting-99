<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e7490">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<title>Money Manager & Budgeting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f5f3;--card:#fff;--ink:#14272b;--mute:#62757a;--line:#d9e3df;--pri:#0f5c4d;--on:#fff;--inc:#14804a;--exp:#c23b4e;--soft:#e4efeb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1c;--card:#142427;--ink:#e6f0ee;--mute:#91a6a6;--line:#27393c;--pri:#3fb59b;--on:#06211b;--inc:#4cc58a;--exp:#f08092;--soft:#1b3235;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1c;--card:#142427;--ink:#e6f0ee;--mute:#91a6a6;--line:#27393c;--pri:#3fb59b;--on:#06211b;--inc:#4cc58a;--exp:#f08092;--soft:#1b3235;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:84px}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--mute)}
h2{font-size:16px;font-weight:800;margin:22px 0 8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.hero{background:var(--pri);color:var(--on);border-radius:20px;padding:20px}
.hero small{opacity:.8;font-weight:600}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grid div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px}
.grid b{display:block;font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.mn{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.mn button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px}
.mn b{font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:8px}
.mute{color:var(--mute);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.three b{display:block;font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.bar i.over{background:var(--exp)}
.day{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--mute);margin:16px 2px 6px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx.g{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:10px}
.tx.g>b{white-space:nowrap;text-align:right;min-width:76px}
.tx.g .x{padding:2px 6px}
.lst{max-height:60vh;overflow-y:auto;overflow-x:hidden}
.lst .day:first-child{margin-top:0}
.tx>div:first-child{flex:1;min-width:0}
.tx small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--pri);color:var(--on)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;padding:14px 0;font-size:12px;font-weight:600;color:var(--mute);border-top:3px solid transparent}
nav button.on{color:var(--pri);border-top-color:var(--pri)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty a{color:var(--pri);font-weight:600;cursor:pointer}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
dialog input,dialog select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px;font-weight:600}
.seg button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.bi{width:90px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:right}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .pair{display:flex;align-items:flex-end;gap:3px;width:100%;flex:1}
.chart .pair i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.chart .pair i:first-child{background:var(--inc)}.chart .pair i:last-child{background:var(--exp)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
:root[data-skin="sakura"]{--pri:#cf4378;--on:#fff;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}
:root[data-skin="lavender"]{--pri:#7359d1;--on:#fff;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}
:root[data-skin="sky"]{--pri:#2a78c7;--on:#fff;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}
.tx>div:first-child{cursor:pointer}
:root{--g1:#0e7490;--g2:#15803d;--inc:#12a15b;--exp:#ef476f}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--g1) 22%,var(--bg)),var(--bg) 340px) no-repeat,var(--bg)}
.hero{background:radial-gradient(circle at 92% 8%,rgba(255,255,255,.3),transparent 45%),linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.btn:not(.ghost){background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.card{border-radius:16px}
.bar{height:10px;border-radius:5px}
h2{border-left:4px solid var(--pri);padding-left:8px}
nav button.on{background:color-mix(in srgb,var(--pri) 10%,transparent)}
.ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:19px;flex:none}
:root[data-skin="sakura"]{--g1:#be185d;--g2:#c2410c}
:root[data-skin="lavender"]{--g1:#6d28d9;--g2:#2563eb}
:root[data-skin="sky"]{--g1:#1d4ed8;--g2:#0e7490}

:root[data-skin="forest"]{--pri:#15803d;--on:#fff;--g1:#166534;--g2:#0f766e;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}

dialog{max-height:90vh;overflow:auto}
.ipp{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;font-size:12px}
.tabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.eg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-height:190px;overflow:auto}

.eg button:hover{background:var(--soft)}

<script>
const KEY="mm-v1",CI=["Salary","Bonus","Other income","Net Profit from Sales"];let CE=[];
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,"0");
const nw=new Date(),today=nw.getFullYear()+"-"+pad(nw.getMonth()+1)+"-"+pad(nw.getDate());
let M=today.slice(0,7),tab="ov",ty="exp";
const def=()=>({acc:[{id:"a1",name:"Cash",bal:0}],tx:[],bm:{},debt:[]});

try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}

function fix(){S.bfo=S.bfo||{};(S.acc||[]).forEach(a=>{if(a.ty=="prop")a.ty="fa"});(S.loans||[]).forEach(l=>{delete l.mg});S.cl=S.cl||{};S.rc=S.rc||[];S.og=S.og||[];S.pv=S.pv||[];S.pvN=S.pvN||0;S.eq=S.eq||[];S.rec=S.rec||[];S.ct=S.ct||[];S.loans=S.loans||[];S.gl=S.gl||[];S.sal=S.sal||{};S.btx=S.btx||[];S.dep=S.dep||[];S.bcat=S.bcat||{sale:["Product sales","Service income"],cost:["Purchase of goods","Packaging","Freight in"],exp:["Rent","Salaries","Utilities","Marketing","Transport","Other expenses"],oinc:["Interest","Other income"]};S.ins=S.ins||[];S.ev=S.ev||[];S.nt=S.nt||[];S.gm=S.gm||{};S.pf=S.pf||{};S.co=S.co||{};S.inv=S.inv||[];S.invN=S.invN||0;S.recN=S.recN||0;S.bm=S.bm||{};S.bz=S.bz||{r:[],conf:{}};S.acc.forEach(a=>a.ty=a.ty||"liq");
const DC=[["Food","🍜","#e07a3f"],["Transport","🚌","#3a86c8"],["Bills","🧾","#8a63d2"],["Shopping","🛍️","#d0467a"],["Health","💊","#2a9d8f"],["Entertainment","🎬","#c9a227"],["Other","📦","#6c7a89"],["Saving","🐷","#4c9f4c"]];
S.cats=S.cats||DC.map(([n,e,c])=>({n,e,c,g:n=="Saving"?"oth":"reg"}));CE=S.cats.filter(c=>!c.arch).map(c=>c.n);if(!S.pfx||!S.pfx.length)S.pfx=[{id:"p1",pre:(S.co&&S.co.pre)||"INV",next:(S.invN||0)+1}];document.documentElement.dataset.skin=S.skin||""}
fix();
const save=q=>{if(!q)S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!q)queuePush()};

const tot=(a,t)=>a.filter(x=>x.type==t).reduce((s,x)=>s+x.amt,0);
const eff=a=>S.tx.reduce((s,t)=>s+(t.acc==a.id?(t.type=="inc"||t.type=="adj"?t.amt:-t.amt):0)+(t.to==a.id?t.amt:0),0)+S.bz.r.reduce((s,r)=>s+bzCash(r).reduce((x,c)=>x+(c.acc==a.id?c.amt:0),0),0)+S.btx.reduce((s,x)=>s+(x.to==a.id?x.amt:0)-(x.from==a.id?x.amt:0),0)+S.eq.reduce((s,q)=>s+(q.acc==a.id?(q.t=="cap"?q.amt:-q.amt):0),0);

const catTot=mt=>{const o={};mt.filter(t=>t.type=="exp").forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const catBars=l=>{const mx=l[0]?l[0][1]:1;return l.map(([c,v])=>{const k=S.cats.find(x=>x.n==c)||{e:"🧾",c:"#6c7a89"};return `<div style="margin-bottom:12px"><div class="row"><span>${ico(k.e,18)} ${esc(c)}</span><b>${RM(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${k.c}"></i></div></div>`}).join("")};

function draw(){
  $("#main").innerHTML=({ov,dl,bg,rp,mr,bz,iv,cal,nt,gm,ist,sofp,sal,ppd,gl,age,bzv,bzc,ln,lnb,acs,st,cus,rcr,cfs,pvl,hp,hpb,rcn,own,pl,bset,ch})[tab]();

function ov(){
  const mt=S.tx.filter(t=>t.date.startsWith(M)),inc=tot(mt,"inc"),exp=tot(mt,"exp");

  const cl=catTot(mt);
  return `<div class="hero"><small>Net worth</small><div class="big">${RM(accs+ow-oe)}</div>
  <div class="grid"><div><small>Accounts</small><b>${RM(accs)}</b></div><div><small>Owed to me</small><b>${RM(ow)}</b></div><div><small>I owe</small><b>${RM(oe)}</b></div></div></div>

function spentIn(m,c){return S.tx.filter(t=>(t.type=="exp"||t.type=="tr")&&t.cat==c&&t.date.startsWith(m)).reduce((x,t)=>x+t.amt,0)}
function bgData(m){
  const ms=[...S.tx.map(t=>t.date.slice(0,7)),...Object.keys(S.bm)].sort(),st=ms[0],o={};
  if(!st||m<st){CA().forEach(c=>o[c]={bf:0,b:0,s:0,raw:0,cf:0});return o}
  let cur=st,cf={};
  for(;;){
    {const sm={},rw={};CA().forEach(c=>{rw[c]=spentIn(cur,c);sm[c]=rw[c]});S.cats.forEach(c=>{if(c.p&&sm[c.p]!=null&&!(((S.bm[cur]||{})[c.n])>0)){sm[c.p]+=sm[c.n];sm[c.n]=0}});
    CA().forEach(c=>{const bf=cf[c]||0,b=(S.bm[cur]||{})[c]||0,sp=sm[c];o[c]={bf,b,s:sp,raw:rw[c],cf:bf+b-sp}})}
    if(cur>=m)return o;
    CA().forEach(c=>cf[c]=o[c].cf);cur=shiftM(cur,1);
  }
}

  <div class="bar"><i class="${d.s>av?"over":""}" style="width:${p}%;${d.s>av?"":"background:"+c.c}"></i></div>
  <div class="row mute" style="margin-top:6px"><span>B/F ${RM(d.bf)}</span><span>Spent ${RM(d.s)}</span><span class="${d.cf<0?"exp":""}">C/F ${RM(d.cf)}</span></div>${rolled.length?`<div class="mute" style="font-size:12px;margin-top:4px">Includes ${rolled.map(k=>esc(k.n)+" "+RM(D[k.n].raw)).join(", ")}</div>`:""}${d.cf<0?`<div class="exp" style="font-size:12px;margin-top:4px">Overspent. ${RM(-d.cf)} is deducted from next month’s budget.</div>`:""}</div>`}

function bizMoves(a,d){const e=[];

  S.btx.forEach(x=>{if(x.date>d)return;const nm=id=>(S.acc.find(y=>y.id==id)||{}).name||"";if(x.to==a.id)e.push({date:x.date,t:"From "+nm(x.from)+(x.note?" · "+x.note:""),v:x.amt});if(x.from==a.id)e.push({date:x.date,t:"To "+nm(x.to)+(x.note?" · "+x.note:""),v:-x.amt})});

const balB=(a,d)=>{const t=bizMoves(a,d).reduce((x,m)=>x+m.v,0);return isL(a)?a.bal-t:a.bal+t};
function sofpData(d){const B=S.acc.filter(a=>a.biz);
  const mk=(title,types,extra)=>{let tot=0;const groups=types.map(([ty,name])=>({name,items:B.filter(a=>a.ty==ty).map(a=>{const v=balB(a,d);tot+=v;return{id:a.id,name:a.name,e:aic(a),v}})})).filter(g=>g.items.length);
    extra.forEach(([name,v,k])=>{if(v){tot+=v;groups.push({name:"",items:[{name,v,k}]})}});return{title,groups,tot}};
  const ctx=(ks,ty)=>{const m={};S.bz.r.filter(r=>bzOut(r)>0.005&&r.date<=d&&ks.includes(r.k)).forEach(r=>{const k=r.ct||"";m[k]=(m[k]||0)+bzOut(r)});return Object.entries(m).map(([k,v])=>[(k?((S.ct.find(c=>c.id==k)||{}).n||"Contact"):"Unassigned")+(ty=="c"?" (receivable)":" (payable)"),v,"ct:"+k+":"+ty])};
  const A=mk("Assets",[["liq","Cash and bank"],["sav","Savings"],["rec","Receivables"],["aci","Accrued income"],["pre","Prepayments"],["dpa","Deposits paid"],["fa","Fixed assets"],["oth","Other assets"]],ctx(["sale"],"c"));
  const L=mk("Liabilities",[["pay","Payables"],["acr","Accruals"],["dpl","Deposits received"],["hld","Held for others"],["lia","Loans and other liabilities"]],ctx(["cost","exp"],"s"));
  const net=A.tot-L.tot,cap=S.eq.filter(q=>q.date<=d&&q.t=="cap").reduce((x,q)=>x+q.amt,0),dr=S.eq.filter(q=>q.date<=d&&q.t=="draw").reduce((x,q)=>x+q.amt,0),pr=S.bz.r.filter(r=>r.date<=d).reduce((x,r)=>x+(r.k=="sale"||r.k=="oinc"?r.amt:-r.amt),0);
  const prBf=S.bz.r.filter(r=>r.date<fyRange(fyOf(d)).s).reduce((x,r)=>x+(r.k=="sale"||r.k=="oinc"?r.amt:-r.amt),0);
  return{sec:[A,L],net,eq:[["Owner capital",cap],["Drawings",-dr],["Retained profit brought forward",prBf],["Profit for the year",pr-prBf],["Opening balances and adjustments",net-(cap-dr+pr)]]}}

  return bkb("Aging report")+`<div class="card"><div class="row"><b>Total unpaid invoices</b><b>${RM(tot)}</b></div></div>`+B.map(([n,f])=>{const g=l.filter(i=>f(dd(i))).sort((a,b)=>dd(b)-dd(a));if(!g.length)return"";return `<h2>${n} <span class="mute">${RM(g.reduce((a,i)=>a+invOut(i),0))}</span></h2><div class="card" style="padding:4px 14px">${g.map(i=>`<div class="tx"><div style="cursor:default"><b>${esc(i.cust)}</b><small>${esc(i.no)} · due ${i.due}${dd(i)>0?" · "+dd(i)+" days late":""}</small></div><b>${RM(invOut(i))}</b><button class="btn ghost sm" onclick="waRemind('${i.id}')">Remind</button></div>`).join("")}</div>`}).join("")||`<div class="empty">No unpaid invoices. 🎉</div>`}
function waRemind(id){const i=S.inv.find(x=>x.id==id),t={total:invOut(i)},m="Hi "+i.cust+", a friendly reminder that invoice "+i.no+" for "+RM(t.total)+" was due on "+i.due+". "+(S.co.bank?"Payment details: "+S.co.bank+". ":"")+"Thank you."+(S.co.name?" - "+S.co.name:"");window.open("https://wa.me/?text="+encodeURIComponent(m),"_blank")}
lockApp();

const skbbk=w=>{if(!(w>0))return 0;let mid;if(w>6000)mid=5950;else if(w>1000)mid=Math.ceil(w/100)*100-50;else{const e=[30,50,70,100,140,200,300,400,500,600,700,800,900,1000];let lo=0,hi=1000;for(let i=0;i<e.length;i++){if(w<=e[i]){hi=e[i];lo=i?e[i-1]:0;break}}mid=(lo+hi)/2}
  const x=mid*.0075/.05,f=Math.floor(x+1e-9),tie=Math.abs(x-f-.5)<1e-6,u=tie?(f%2?f:f+1):Math.round(x);return +(u*.05).toFixed(2)};
/* ---------- business: records by type and category ---------- */
let BZF={k:null,c:null};
const bzOpen=k=>{BZF={k,c:null};go("bzv")};
function bzRow(r){return `<div class="tx"><div style="cursor:pointer" onclick="addBz('${r.id}')"><b>${BN[r.k]}${r.c?" · "+esc(r.c):""}</b><small>${r.date}${r.ref?" · "+esc(r.ref):""}${r.ct?" · "+esc((S.ct.find(c=>c.id==r.ct)||{}).n||""):""}${r.note?" · "+esc(r.note):""}${bzSt(r)}${r.acc?" · "+esc((S.acc.find(a=>a.id==r.acc)||{}).name||""):""}</small></div><b>${RM(r.amt)}</b>${r.paid?"":`<button class="btn ghost sm" onclick="paidBz('${r.id}')">Paid</button>`}<button class="x" aria-label="Delete" onclick="delBz('${r.id}')">×</button></div>`}
const pvTotal=v=>v.lines.reduce((a,l)=>a+l.amt,0);
function bizItems(){const nm=id=>(S.acc.find(a=>a.id==id)||{}).name||"",L=[];
  S.bz.r.forEach(r=>L.push({kd:r.k,date:r.date,t:BN[r.k]+(r.c?" · "+r.c:""),s:[(S.ct.find(c=>c.id==r.ct)||{}).n,r.note,bzSt(r).replace(" · ",""),nm(r.acc)].filter(Boolean).join(" · "),amt:r.amt,op:`addBz('${r.id}')`,r}));
  S.btx.forEach(x=>L.push({kd:"btx",date:x.date,t:"Transfer or journal",s:[nm(x.from)+" → "+nm(x.to),x.note].filter(Boolean).join(" · "),amt:x.amt,op:`newBtx('${x.id}')`}));
  S.eq.forEach(q=>L.push({kd:"eq",date:q.date,t:q.t=="cap"?"Capital in":"Drawings",s:[nm(q.acc),q.note].filter(Boolean).join(" · "),amt:q.amt,op:`newEq('${q.id}')`}));
  S.pv.forEach(v=>L.push({kd:"pv",date:v.date,t:"Payment voucher "+v.no,s:[v.payee,v.status=="paid"?"paid":"draft"].filter(Boolean).join(" · "),amt:pvTotal(v),op:`viewPv('${v.id}')`}));
  return L}
function bzv(){const{k,c}=BZF,F=[[null,"All"],["sale","Sales"],["cost","Cost of sales"],["exp","Expenses"],["oinc","Other income"],["btx","Transfers"],["eq","Capital"],["pv","Vouchers"]],TT={btx:"Transfers and journal",eq:"Capital and drawings",pv:"Payment vouchers"};
  const l=bizItems().filter(x=>x.date.startsWith(M)&&(!k||x.kd==k)&&(c===null||(x.r&&(x.r.c||"")===c))).sort((a,b)=>b.date.localeCompare(a.date));
  const tot=(k||c!==null)?`<b>${RM(l.reduce((x,r)=>x+r.amt,0))}</b>`:"";
  return bkb((k?(BN[k]||TT[k]):"All business transactions")+(c!==null?" · "+esc(c||"Uncategorised"):""))+mnav()+`<div class="tabs">${F.map(([v,n])=>`<button class="${(k||null)===v?"on":""}" onclick="BZF={k:${v?`'${v}'`:"null"},c:null};draw()">${n}</button>`).join("")}</div><div class="card"><div class="row"><span class="mute">${l.length} entr${l.length==1?"y":"ies"}</span>${tot}</div></div>${l.length?`<div class="card" style="padding:4px 14px">${l.map(x=>`<div class="tx"><div style="cursor:pointer" onclick="${x.op}"><b>${esc(x.t)}</b><small>${x.date}${x.s?" · "+esc(x.s):""}</small></div><b>${RM(x.amt)}</b>${x.r&&!x.r.paid?`<button class="btn ghost sm" onclick="paidBz('${x.r.id}')">Paid</button>`:""}${x.r?`<button class="x" aria-label="Delete" onclick="delBz('${x.r.id}')">×</button>`:""}</div>`).join("")}</div>`:`<div class="empty">No entries.</div>`}<button class="btn fab" aria-label="Add record" onclick="addBz()">+</button>`}

function bzc(){const out=["sale","cost","exp","oinc"].map(k=>{const m={};S.bz.r.filter(r=>r.k==k&&r.date.startsWith(M)).forEach(r=>{const c=r.c||"";m[c]=(m[c]||0)+r.amt});const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);
    return e.length?`<h2>${BN[k]}</h2><div class="card">${e.map(([c,v])=>`<div class="row" style="cursor:pointer" onclick="BZF={k:'${k}',c:'${c}'};go('bzv')"><span>${esc(c||"Uncategorised")} ›</span><b>${RM(v)}</b></div>`).join("")}</div>`:""}).join("");
  return bkb("Transactions by category")+mnav()+(out||`<div class="empty">No records this month.</div>`)}
/* ---------- loans and repayments linked to liability accounts ---------- */
const loanScope=b=>S.acc.filter(a=>!!a.biz==!!b);
const pmtF=(P,rate,n)=>{const r=rate/1200;return r?P*r/(1-Math.pow(1+r,-n)):P/n};
function lnView(biz){const L=S.loans.filter(x=>!!x.biz==!!biz&&!x.hp);
  return (biz?bkb("Loans and borrowing"):bk("Loans"))+`<button class="btn" style="width:100%" onclick="newLoan(${biz?1:0})">Record a new loan</button><div class="mute" style="font-size:12px;margin:8px 0">Each loan is linked to a liability account. Borrowing raises that account and your bank. A repayment lowers the account, and the interest part is recorded as an expense.</div>${L.length?L.map(x=>{const a=S.acc.find(y=>y.id==x.acc);if(!a)return"";const o=bal(a),p=x.orig?Math.max(0,Math.min(100,(x.orig-o)/x.orig*100)):0;
    return `<div class="card"><div class="row"><div><b>${aic(a)} ${esc(a.name)}</b><div class="mute">${x.rate}% a year · ${x.m} months · ${RM(x.pay)} a month</div></div><div style="text-align:right"><b>${RM(o)}</b><div class="mute" style="font-size:11px">outstanding</div></div></div><div class="bar"><i style="width:${p}%"></i></div><div class="row mute" style="margin-top:6px"><span>${Math.round(p)}% repaid</span><span>${x.n||0} of ${x.m} payments</span></div><div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-top:10px"><button class="btn sm" onclick="repayLoan('${x.id}')">Repay</button><button class="btn ghost sm" onclick="borrowMore('${x.id}')">Borrow more</button><button class="btn ghost sm" onclick="loanHist('${x.id}')">History</button><button class="btn ghost sm" onclick="editLoan('${x.id}')">Edit</button><button class="x" aria-label="Delete" onclick="delLoan('${x.id}')">×</button></div></div>`}).join(""):`<div class="empty">No loans yet.</div>`}`}
const ln=()=>lnView(0),lnb=()=>lnView(1);
function drawdown(biz,loan,bank,amt,date,note){if(biz)S.btx.push({id:uid(),from:loan,to:bank,amt,date,note});else S.tx.push({id:uid(),date,type:"tr",amt,cat:"Transfer",acc:loan,to:bank,note,who:""})}
const bankOpts=sc=>sc.filter(a=>["liq","sav","oth"].includes(a.ty)).map(a=>`<option value="${a.id}">${aicT(a)} ${esc(a.name)}</option>`).join("");
function newLoan(biz){const sc=loanScope(biz),ex=sc.filter(a=>a.ty=="lia"&&!S.loans.some(l=>l.acc==a.id));if(!bankOpts(sc)){toast("Add a bank or cash account first");return}
  modal("Record a new loan",`<label>Linked liability account<select id="lo1" onchange="$('#lo1n').style.display=this.value?'none':''"><option value="">＋ Create a new liability account</option>${ex.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></label><label id="lo1n">Loan name (for example Maybank car loan)<input id="lo2" maxlength="40"></label><label>Amount borrowed (${S.cur||"RM"})<input id="lo3" type="number" inputmode="decimal" step="0.01" min="0"></label><label>Interest rate a year (%)<input id="lo4" type="number" inputmode="decimal" step="0.01" min="0" value="0"></label><label>Number of months<input id="lo5" type="number" inputmode="numeric" min="1" max="600" value="60"></label><label>Money received into<select id="lo6">${bankOpts(sc)}</select></label><label>Date received<input id="lo7" type="date" value="${today}"></label><label><input id="lo8" type="checkbox" checked style="display:inline;width:auto;margin-right:8px">Record the money received in my bank (untick if it is already in the account balance)</label>`,()=>{
    const nm=$("#lo2").value.trim(),P=Number($("#lo3").value),rt=Number($("#lo4").value)||0,m=Math.round(Number($("#lo5").value)),dt=$("#lo7").value;let ac=$("#lo1").value;
    if(!(P>0)||!(m>=1)||!dt||(!ac&&!nm)){toast("Fill in the loan name, amount, months and date");return false}
    if(!ac){const a={id:uid(),name:nm,bal:0,ty:"lia",e:"🏦",biz:biz?true:false};S.acc.push(a);ac=a.id}
    S.loans.push({id:uid(),acc:ac,rate:rt,m,start:dt,pay:Math.round(pmtF(P,rt,m)*100)/100,orig:P,n:0,biz:biz?1:0});
    if($("#lo8").checked)drawdown(biz,ac,$("#lo6").value,P,dt,"Loan received");save();draw();toast("Loan recorded")})}
function borrowMore(id){const x=S.loans.find(l=>l.id==id),sc=loanScope(x.biz);
  modal("Borrow more",`<label>Amount (${S.cur||"RM"})<input id="bm1" type="number" inputmode="decimal" step="0.01" min="0"></label><label>Money received into<select id="bm2">${bankOpts(sc)}</select></label><label>Date<input id="bm3" type="date" value="${today}"></label>`,()=>{
    const a=Number($("#bm1").value),d=$("#bm3").value;if(!(a>0)||!d){toast("Enter an amount and a date");return false}
    drawdown(x.biz,x.acc,$("#bm2").value,a,d,"Loan received");x.orig+=a;save();draw();toast("Recorded")})}
function repayLoan(id){const x=S.loans.find(l=>l.id==id),a=S.acc.find(y=>y.id==x.acc),sc=loanScope(x.biz),o=bal(a),it=x.hp?Math.round(x.int/x.m*100)/100:Math.round(o*x.rate/1200*100)/100;
  modal("Record a repayment",`<p class="mute">${esc(a.name)} · outstanding ${RM(o)}</p><label>Payment (${S.cur||"RM"})<input id="rp1" type="number" inputmode="decimal" step="0.01" min="0" value="${Math.min(x.pay,o+it)}" oninput="rpUp()"></label><label>Interest part<input id="rp2" type="number" inputmode="decimal" step="0.01" min="0" value="${it}" oninput="rpUp()"></label><div class="mute" id="rp4" style="margin-bottom:10px"></div><label>Paid from<select id="rp3">${bankOpts(sc)}</select></label><label>Date<input id="rp5" type="date" value="${today}"></label>`,()=>{
    const pay=Number($("#rp1").value),int=Math.min(pay,Number($("#rp2").value)||0),pr=Math.round((pay-int)*100)/100,d=$("#rp5").value,bk2=$("#rp3").value;
    if(!(pay>0)||!d){toast("Enter the payment and a date");return false}if(pr>o+0.005){toast("Principal is more than the outstanding balance");return false}
    if(pr>0){if(x.biz)S.btx.push({id:uid(),from:bk2,to:x.acc,amt:pr,date:d,note:"Loan repayment"});else S.tx.push({id:uid(),date:d,type:"tr",amt:pr,cat:"Transfer",acc:bk2,to:x.acc,note:"Loan repayment: "+a.name,who:""})}
    if(int>0){if(x.biz){if(!S.bcat.exp.includes("Interest"))S.bcat.exp.push("Interest");S.bz.r.push({id:uid(),k:"exp",c:"Interest",acc:bk2,amt:int,date:d,note:"Loan interest: "+a.name,paid:true})}else{if(!S.cats.some(c=>c.n=="Interest")){S.cats.push({n:"Interest",e:"💸",c:"#6c7a89",g:"reg"});CE=S.cats.filter(c=>!c.arch).map(c=>c.n)}S.tx.push({id:uid(),date:d,type:"exp",amt:int,cat:"Interest",acc:bk2,who:a.name,note:"Loan interest: "+a.name})}}
    x.n=(x.n||0)+1;save();draw();toast("Repayment recorded")});rpUp()}
function rpUp(){const e=$("#rp4");if(!e)return;const p=Number($("#rp1").value)||0,i=Number($("#rp2").value)||0;e.textContent="Principal "+RM(Math.max(0,p-i))+" lowers the loan. Interest "+RM(i)+" is an expense."}
function delLoan(id){const x=S.loans.find(l=>l.id==id),a=S.acc.find(y=>y.id==x.acc);modal("Remove this loan?",`<p class="mute">${esc(a?a.name:"Loan")} will be removed from the loan list. The account and its transactions stay.</p>`,()=>{S.loans=S.loans.filter(l=>l.id!=id);save();draw()},"Remove")}

const ctOwed=c=>ctRecs(c).filter(r=>bzOut(r)>0.005&&(c.t=="c"?r.k=="sale":(r.k=="cost"||r.k=="exp"))).reduce((x,r)=>x+bzOut(r),0);
const bctFill=()=>{const k=$("#bk").value,t=(k=="sale"||k=="oinc")?"c":"s",sl=$("#bct");$("#bcl").firstChild.nodeValue=t=="c"?"Customer":"Supplier";sl.innerHTML=`<option value="">None</option>`+S.ct.filter(c=>c.t==t).map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join("")};
function cus(){const l=S.ct.filter(c=>c.t==CTT).sort((a,b)=>a.n.localeCompare(b.n));
  return bkb("Customers and suppliers")+`<div class="seg" style="grid-template-columns:1fr 1fr"><button class="${CTT=="c"?"on":""}" onclick="CTT='c';draw()">Customers</button><button class="${CTT=="s"?"on":""}" onclick="CTT='s';draw()">Suppliers</button></div><button class="btn" style="width:100%" onclick="editCt()">Add ${CTT=="c"?"customer":"supplier"}</button><div class="mute" style="font-size:12px;margin:8px 0">${CTT=="c"?"What customers owe you is a receivable, an asset in the financial position.":"What you owe suppliers is a payable, a liability in the financial position."} Link them when you record a sale, cost, expense or invoice.</div>${l.length?l.map(c=>{const o=ctOwed(c);return `<div class="card" style="cursor:pointer" onclick="ctView('${c.id}')"><div class="row"><div><b>${esc(c.n)}</b><div class="mute">${esc(c.phone||c.email||"")}</div></div><div style="text-align:right"><b class="${o>0?(c.t=="c"?"inc":"exp"):""}">${RM(o)}</b><div class="mute" style="font-size:11px">${c.t=="c"?"owes you":"you owe"}</div></div></div></div>`}).join(""):`<div class="empty">None yet.</div>`}`}

function delCt(id){const c=S.ct.find(x=>x.id==id);modal("Delete this contact?",`<p class="mute">${esc(c.n)} will be removed. Their records and invoices stay but lose the link.</p>`,()=>{S.ct=S.ct.filter(x=>x.id!=id);save();draw()},"Delete")}
function ctView(id){const c=S.ct.find(x=>x.id==id),r=ctRecs(c).sort((a,b)=>b.date.localeCompare(a.date)),iv=S.inv.filter(i=>i.ct==id).sort((a,b)=>b.date.localeCompare(a.date)),o=ctOwed(c),tot=r.reduce((x,y)=>x+y.amt,0);
  $("#dlg").innerHTML=`<h3>${esc(c.n)}</h3><div class="lst"><div class="mute">${[c.phone,c.email].filter(Boolean).map(esc).join(" · ")}${c.addr?"<br>"+esc(c.addr):""}</div><div class="card" style="margin-top:8px"><div class="row"><span class="mute">${c.t=="c"?"Owes you (receivable)":"You owe (payable)"}</span><b>${RM(o)}</b></div><div class="row"><span class="mute">Total ${c.t=="c"?"sales and income":"costs and expenses"}</span><b>${RM(tot)}</b></div></div>${iv.length?`<div class="mute" style="font-weight:700;margin:8px 0 4px">Invoices</div>`+iv.map(i=>`<div class="tx"><div style="cursor:pointer" onclick="viewInv('${i.id}')"><b>${esc(i.no)}</b><small>${i.date} · ${i.paid?"Paid":"Unpaid"}</small></div><b>${RM(invTot(i).total)}</b></div>`).join(""):""}${r.length?`<div class="mute" style="font-weight:700;margin:8px 0 4px">Records</div>`+r.map(x=>`<div class="tx"><div style="cursor:pointer" onclick="addBz('${x.id}')"><b>${BN[x.k]}${x.c?" · "+esc(x.c):""}</b><small>${x.date}${bzSt(x)}${x.note?" · "+esc(x.note):""}</small></div><b>${RM(x.amt)}</b></div>`).join(""):""}</div><div class="acts"><button class="btn ghost" onclick="dlg.close()">Close</button><button class="btn" onclick="editCt('${c.id}')">Edit</button></div>`;
  trDom(dlg);if(!dlg.open)dlg.showModal()}

const locked=d=>!!S.lockTo&&String(d).slice(0,7)<=S.lockTo;
function eqList(){if(!S.eq.length)return"";return `<h2>Capital and drawings</h2><div class="card" style="padding:4px 14px">${S.eq.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(q=>`<div class="tx"><div style="cursor:pointer" onclick="newEq('${q.id}')"><b>${q.t=="cap"?"Capital in":"Drawings"}</b><small>${q.date}${q.note?" · "+esc(q.note):""} · ${esc((S.acc.find(a=>a.id==q.acc)||{}).name||"")}</small></div><b>${RM(q.amt)}</b><button class="x" aria-label="Delete" onclick="delEq('${q.id}')">×</button></div>`).join("")}</div>`}
function newEq(id){const B=S.acc.filter(a=>a.biz&&["liq","sav"].includes(a.ty)),e=S.eq.find(x=>x.id==id)||null;if(!B.length){toast("Add a business bank or cash account first");return}
  if(e&&locked(e.date)){toast("That month is locked");return}
  modal(e?"Edit capital or drawings":"Capital or drawings",`<label>Type<select id="eq1"><option value="cap" ${e&&e.t=="cap"?"selected":""}>Capital in (owner puts money in)</option><option value="draw" ${e&&e.t=="draw"?"selected":""}>Drawings (owner takes money out)</option></select></label><label>Amount (${S.cur||"RM"})<input id="eq2" type="number" inputmode="decimal" step="0.01" min="0" value="${e?e.amt:""}"></label><label>Date<input id="eq3" type="date" value="${e?e.date:today}"></label><label>Account<select id="eq4">${B.map(a=>`<option value="${a.id}" ${e&&e.acc==a.id?"selected":""}>${aicT(a)} ${esc(a.name)}</option>`).join("")}</select></label><label>Note<input id="eq5" maxlength="60" value="${e?esc(e.note||""):""}"></label>${e?`<button class="btn ghost sm" onclick="delEq('${e.id}')">Delete</button>`:""}`,()=>{
    const a=Number($("#eq2").value),d=$("#eq3").value;if(!(a>0)||!d){toast("Enter an amount and a date");return false}if(locked(d)){toast("That month is locked");return false}
    const v={t:$("#eq1").value,amt:a,date:d,acc:$("#eq4").value,note:$("#eq5").value.trim()};if(e)Object.assign(e,v);else S.eq.push({id:uid(),...v});save();draw();toast("Saved")})}

function delEq(id){const q=S.eq.find(x=>x.id==id);if(q.og){toast("This belongs to Owner funding. Change it there.");return}if(locked(q.date)){toast("That month is locked");return}modal("Delete this entry?",`<p class="mute">${q.t=="cap"?"Capital in":"Drawings"} · ${RM(q.amt)} · ${q.date}</p>`,()=>{S.eq=S.eq.filter(x=>x.id!=id);save();draw()},"Delete")}
function agePay(){const l=S.bz.r.filter(r=>bzOut(r)>0.005&&(r.k=="cost"||r.k=="exp")),dd=r=>Math.round((new Date(today+"T00:00")-new Date(r.date+"T00:00"))/864e5);if(!l.length)return"";
  const B=[["Within 30 days",x=>x<=30],["31 to 60 days",x=>x>=31&&x<=60],["61 to 90 days",x=>x>=61&&x<=90],["Over 90 days",x=>x>90]];

/* ---------- bank reconciliation ---------- */
let RCA="";
function rcnEntries(a){const L=[],nm=id=>(S.acc.find(y=>y.id==id)||{}).name||"",add=(key,date,t,v)=>L.push({key,date,t,v});
  if(a.biz){S.bz.r.forEach(r=>{bzCash(r).forEach(c=>{if(c.acc==a.id)add("bz:"+r.id+(c.pid?":"+c.pid:""),c.date,BN[r.k]+(r.c?" · "+r.c:"")+(r.note?" · "+r.note:""),c.amt)})});
    S.btx.forEach(x=>{if(x.to==a.id)add("bt:"+x.id,x.date,"From "+nm(x.from)+(x.note?" · "+x.note:""),x.amt);if(x.from==a.id)add("bt:"+x.id,x.date,"To "+nm(x.to)+(x.note?" · "+x.note:""),-x.amt)});
    S.eq.forEach(q=>{if(q.acc==a.id)add("eq:"+q.id,q.date,(q.t=="cap"?"Capital in":"Drawings")+(q.note?" · "+q.note:""),q.t=="cap"?q.amt:-q.amt)})}
  S.tx.forEach(t=>{if(t.acc==a.id)add("tx:"+t.id+":a",t.date,t.cat+(t.note?" · "+t.note:""),(t.type=="inc"||t.type=="adj")?t.amt:-t.amt);if(t.to==a.id)add("tx:"+t.id+":t",t.date,"Transfer in"+(t.note?" · "+t.note:""),t.amt)});
  return L.sort((p,q)=>p.date.localeCompare(q.date))}
function rcn(){const accs=S.acc.filter(a=>["liq","sav"].includes(a.ty));if(!accs.length)return bk("Bank reconciliation")+`<div class="empty">Add a bank account first.</div>`;
  if(!RCA||!accs.some(a=>a.id==RCA))RCA=accs[0].id;const a=accs.find(x=>x.id==RCA),cl=new Set(S.cl[RCA]||[]),all=rcnEntries(a),open=all.filter(e=>!cl.has(e.key)),base=Math.round((a.bal+all.filter(e=>cl.has(e.key)).reduce((x,e)=>x+e.v,0))*100)/100,hist=S.rc.filter(r=>r.acc==RCA).sort((p,q)=>q.date.localeCompare(p.date));
  return bk("Bank reconciliation")+`<div class="card"><select class="bi" style="width:100%;text-align:left" onchange="RCA=this.value;draw()">${accs.map(x=>`<option value="${x.id}" ${x.id==RCA?"selected":""}>${x.biz?"Business · ":""}${esc(x.name)}</option>`).join("")}</select><div class="row" style="margin-top:10px"><span class="mute">Reconciled balance so far</span><b>${RM(base)}</b></div></div><div class="card"><div class="mute" style="font-size:13px;margin-bottom:4px">Closing balance on your statement</div><input id="rb" class="bi" style="width:100%;text-align:left" type="number" inputmode="decimal" step="0.01" oninput="rcnCalc()" placeholder="0.00"><div class="mute" style="font-size:13px;margin:8px 0 4px">Statement date</div><input id="rd" type="date" class="bi" style="width:100%;text-align:left" value="${today}"></div><div class="mute" style="font-size:12px;margin:6px 0">Tick the entries that appear on your statement.</div><div class="card" style="padding:4px 14px" id="rbase" data-b="${base}">${open.length?open.map(e=>`<label class="tx" style="color:var(--ink)"><input type="checkbox" class="rck" value="${e.key}" data-v="${e.v}" onchange="rcnCalc()" style="width:auto;margin:0"><div style="min-width:0"><b>${esc(e.t)}</b><small>${e.date}</small></div><b class="${e.v<0?"exp":"inc"}">${e.v<0?"−":"+"}${RM(Math.abs(e.v)).replace(/^\S+ /,"")}</b></label>`).join(""):`<div class="empty">Everything is reconciled.</div>`}</div><div class="card"><div class="row"><b>Difference</b><b id="rdf">–</b></div><div style="margin-top:10px"><button class="btn" onclick="rcnDone()">Finish reconciliation</button></div></div>${hist.length?`<h2>History</h2><div class="card" style="padding:4px 14px">${hist.map(h=>`<div class="tx"><div style="cursor:default"><b>${h.date}</b><small>${h.n} entries</small></div><b>${RM(h.stmt)}</b><button class="x" aria-label="Undo" onclick="rcnUndo('${h.id}')">↶</button></div>`).join("")}</div>`:""}`}
function rcnDiff(){const b=Number(($("#rbase")||{dataset:{b:0}}).dataset.b),v=$("#rb").value,sum=[...document.querySelectorAll(".rck:checked")].reduce((x,e)=>x+Number(e.dataset.v),0);return v===""?null:Math.round((Number(v)-(b+sum))*100)/100}
function rcnCalc(){const d=rcnDiff(),e=$("#rdf");if(!e)return;e.textContent=d===null?"–":Math.abs(d)<0.005?"Balanced ✓":RM(d);e.className=d===null||Math.abs(d)<0.005?"inc":"exp"}
function rcnDone(){const d=rcnDiff(),keys=[...document.querySelectorAll(".rck:checked")].map(e=>e.value);if(d===null){toast("Enter the statement closing balance");return}if(Math.abs(d)>=0.005){toast("The difference must be zero. Check the entries you ticked.");return}if(!keys.length){toast("Tick at least one entry");return}
  S.cl[RCA]=[...(S.cl[RCA]||[]),...keys];S.rc.push({id:uid(),acc:RCA,date:$("#rd").value||today,stmt:Number($("#rb").value),n:keys.length,keys});save();draw();toast("Reconciled")}
function rcnUndo(id){const h=S.rc.find(x=>x.id==id);modal("Undo this reconciliation?",`<p class="mute">${h.date} · ${h.n} entries go back to unreconciled.</p>`,()=>{const ks=new Set(h.keys||[]);S.cl[h.acc]=(S.cl[h.acc]||[]).filter(k=>!ks.has(k));S.rc=S.rc.filter(x=>x.id!=id);save();draw()},"Undo")}

function bzPays(r){const h=r.inv&&S.inv.find(x=>x.id==r.inv)||r;return h.pays&&h.pays.length?h.pays:null}
